<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticker — Intraday Radar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">▮</span> Intraday <em>Radar</em></a>
    <span class="byline">by <b>M.S.J Hafiz</b></span>
    <div class="topbar-right">
      <span class="pill badge rounded-pill" id="mode-pill">—</span>
      <span class="pill badge rounded-pill" id="state-pill">—</span>
      <span class="clock" id="et-clock">--:--:-- ET</span>
      <button class="btn btn-primary" id="refresh-btn">⟳ Refresh</button>
    </div>
  </header>
  <div class="tape"><div class="tape-track" id="tape-track"></div></div>
  <main class="container-xxl">
    <div class="crumbs"><a href="/">← screener</a><span>/</span><strong id="crumb-ticker">…</strong></div>

    <section class="panel" id="ticker-panel">
      <div class="panel-head">
        <div>
          <h1 id="h-ticker">… <span class="muted" id="t-name"></span></h1>
          <div class="big-price">
            <span id="t-price">—</span>
            <span id="t-change" class="pill">—</span>
          </div>
        </div>
        <div class="stat-cards" id="stat-cards"></div>
      </div>
      <div class="chart-wrap">
        <div class="chart-live">● LIVE</div>
        <canvas id="chart" height="360"></canvas>
        <div class="chart-readout" id="chart-readout">tap a candle to inspect</div>
      </div>
    </section>

    <div class="two-col">
      <section class="panel">
        <div class="panel-head">
          <h1>Trading signal <span class="sub">1m + 5m multi-indicator confluence · prediction</span></h1>
          <button class="btn btn-primary" id="s-refresh">⟳ Analyze</button>
        </div>
        <div class="signal-verdict neutral" id="signal-verdict"><span class="muted">analyzing…</span></div>
        <div class="conf-wrap">
          <div class="conf-track progress"><div class="conf-bar progress-bar" id="conf-bar"></div></div>
          <span class="conf-label" id="conf-label"></span>
        </div>
        <div class="sig-tfs" id="sig-tfs"></div>
        <div class="prediction" id="sig-prediction"></div>
        <ul class="reasons" id="signal-reasons"></ul>
        <div class="sig-chips" id="sig-chips"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h1>Last bars</h1></div>
        <table class="grid small-table table align-middle" id="bars-table">
          <thead><tr><th>Time (ET)</th><th class="num">O</th><th class="num">H</th><th class="num">L</th><th class="num">C</th><th class="num">Vol</th></tr></thead>
          <tbody id="bars-body"></tbody>
        </table>
      </section>
    </div>
  </main>
  <footer class="site-foot">
    Intraday Radar <span class="sep">•</span> Crafted by <span class="credit">M.S.J Hafiz</span>
  </footer>
  <script src="/static/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

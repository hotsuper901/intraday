<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticker — Intraday Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">▮</span> Intraday <em>Radar</em></a>
    <span class="byline">by <b>M.S.J Hafiz</b></span>
    <div class="topbar-right">
      <span class="pill" id="mode-pill">—</span>
      <span class="pill" id="state-pill">—</span>
      <span class="clock" id="et-clock">--:--:-- ET</span>
      <button class="btn" id="refresh-btn">⟳ Refresh</button>
    </div>
  </header>
  <main>
    <div class="crumbs"><a href="/">← screener</a><span>/</span><strong id="crumb-ticker">…</strong></div>

    <section class="panel" id="ticker-panel">
      <div class="panel-head">
        <div>
          <h1 id="h-ticker">… <span class="muted" id="t-name"></span></h1>
          <div class="big-price">
            <span id="t-price">—</span>
            <span id="t-change" class="pill">—</span>
          </div>
        </div>
        <div class="stat-cards" id="stat-cards"></div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" height="360"></canvas>
        <div class="chart-readout" id="chart-readout">hover a candle</div>
      </div>
    </section>

    <div class="two-col">
      <section class="panel">
        <div class="panel-head"><h1>Entry risk check</h1></div>
        <div class="risk-form">
          <label>Account size $ <input type="number" id="r-account" value="25000" step="500"></label>
          <label>Risk per trade % <input type="number" id="r-risk" value="1" step="0.1" min="0.1" max="10"></label>
          <label>Entry $ <input type="number" id="r-entry" step="0.01"></label>
          <label>Stop $ <input type="number" id="r-stop" step="0.01"></label>
          <button class="btn" id="r-suggest">Suggest stop (1.5×ATR)</button>
        </div>
        <div class="verdict" id="verdict-box"><span class="muted">set a stop to run the check</span></div>
        <ul class="reasons" id="reason-list"></ul>
        <div class="sizing" id="sizing"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h1>Last bars</h1></div>
        <table class="grid small-table" id="bars-table">
          <thead><tr><th>Time (ET)</th><th class="num">O</th><th class="num">H</th><th class="num">L</th><th class="num">C</th><th class="num">Vol</th></tr></thead>
          <tbody id="bars-body"></tbody>
        </table>
      </section>
    </div>
  </main>
  <footer class="site-foot">
    Intraday Radar <span class="sep">•</span> Crafted by <span class="credit">M.S.J Hafiz</span>
  </footer>
  <script src="/static/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

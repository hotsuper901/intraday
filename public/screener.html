<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Real-time intraday screener for US equities, crypto and forex with multi-timeframe buy/sell signals, predictions and risk checks.">
  <meta name="theme-color" content="#090014">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff00ff'/%3E%3Cstop offset='1' stop-color='%2300ffff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' fill='url(%23g)'/%3E%3Cpath d='M7 21 L12 13 L16 17 L20 10 L25 18' stroke='%23090014' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta property="og:title" content="Screener — Intraday Radar">
  <meta property="og:description" content="Real-time intraday screener for US equities, crypto and forex with multi-timeframe buy/sell signals, predictions and risk checks.">
  <meta property="og:type" content="website">
  <title>Screener — Intraday Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="preload" href="/static/style.css?v=22" as="style">
  <link rel="stylesheet" href="/static/style.css?v=22">
</head>
<body class="data-page">
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">▮</span> Intraday <em>Radar</em></a>
    <span class="byline">by <b>M.S.J Hafiz</b></span>
    <nav class="topnav" aria-label="Primary">
      <a href="/screener" class="topnav-link active">Screener</a>
      <a href="/guide" class="topnav-link">Guide</a>
    </nav>
    <div class="topbar-right">
      <a class="btn btn-ghost" href="/guide" title="How to trade the signal — Binomo, Pocket Option, IQ Option & more" aria-label="Trading manual">📘 <span class="btn-text">How to use</span></a>
      <span class="pill" id="mode-pill">—</span>
      <span class="pill" id="state-pill">—</span>
      <span class="clock" id="et-clock">--:--:-- ET</span>
      <button class="btn" id="refresh-btn" aria-label="Refresh data">⟳ <span class="btn-text">Refresh</span></button>
    </div>
    <div class="searchbox">
      <input id="sym-search" type="text" placeholder="Search symbol… ( / )" autocomplete="off" aria-label="Search symbol" spellcheck="false">
      <div class="sym-drop" id="sym-drop" role="listbox"></div>
    </div>
  </header>
  <div class="tape"><div class="tape-track" id="tape-track"></div></div>
  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <h1>Screener <span class="sub">equities · crypto · forex — find the movers that matter</span></h1>
        <button class="btn btn-ghost filter-toggle" id="filter-toggle">Filters ▾</button>
      </div>
      <div class="filters" id="filters-panel">
        <label>Min chg % <input type="number" id="f-min-change" step="0.1" placeholder="0.0"></label>
        <label>Min rel vol <input type="number" id="f-min-relvol" step="0.1" placeholder="0"></label>
        <label>Min price <input type="number" id="f-min-price" step="0.01" placeholder="0"></label>
        <label>Max price <input type="number" id="f-max-price" step="0.01" placeholder="∞"></label>
        <label>Direction
          <select id="f-direction">
            <option value="any" selected>Any</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
          </select>
        </label>
        <div class="filters-actions">
          <button class="btn btn-ghost" id="preset-movers">Movers</button>
          <button class="btn btn-ghost" id="preset-all">All</button>
        </div>
      </div>
      <div class="breadth" id="breadth"></div>
      <div class="table-scroll">
      <table class="grid" id="screener-table">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Name</th>
            <th class="num">Price</th>
            <th data-sort="change_desc" class="num">Chg %</th>
            <th class="num">Open %</th>
            <th data-sort="relvol" class="num">RelVol</th>
            <th data-sort="atr" class="num">ATR %</th>
            <th data-sort="rsi" class="num">RSI</th>
            <th class="num">VWAP Δ%</th>
            <th class="num">Day Vol</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="11" class="empty">Loading…</td></tr>
        </tbody>
      </table>
      </div>
      <div class="panel-foot">
        <span id="refresh-note">waiting for first fetch</span>
        <span id="row-count"></span>
      </div>
    </section>
  </main>
  <footer class="site-foot">
    Intraday Radar <span class="sep">•</span> Crafted by <span class="credit">M.S.J Hafiz</span>
  </footer>
  <script src="/static/chart.js?v=22" defer></script>
  <script src="/static/app.js?v=22" defer></script>
</body>
</html>

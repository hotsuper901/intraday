[project]
name = "intraday-radar"
version = "1.0.0"
description = "Multi-asset intraday screener with entry risk checks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "tzdata>=2024.1",
]

[tool.vercel]
entrypoint = "main:app"

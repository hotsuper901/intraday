<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Real-time intraday screener and trading signals for equities, crypto and forex.">
  <meta name="theme-color" content="#05080f">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M7 21 L12 13 L16 17 L20 10 L25 18' stroke='%2306131c' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta property="og:title" content="Intraday Radar">
  <meta property="og:description" content="Real-time intraday screener and trading signals for equities, crypto and forex.">
  <meta property="og:type" content="website">
  <title>{% block title %}Intraday Radar{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="/static/style.css?v=19" as="style">
  <link rel="stylesheet" href="/static/style.css?v=19">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">▮</span> Intraday <em>Radar</em></a>
    <span class="byline">by <b>M.S.J Hafiz</b></span>
    <nav class="topnav">
      <a href="/" class="topnav-link {% if request.url.path == '/' %}active{% endif %}">Screener</a>
      <a href="/guide" class="topnav-link {% if request.url.path == '/guide' %}active{% endif %}">Guide</a>
    </nav>
    <div class="topbar-right">
      <a class="btn btn-sm btn-outline-primary" href="/guide" title="How to trade the signal — Binomo, Pocket Option, IQ Option & more">📘 <span class="btn-text">How to use</span></a>
      <span class="pill badge rounded-pill" id="mode-pill">{{ data_mode|upper }}</span>
      <span class="pill badge rounded-pill" id="state-pill">{{ market_state|upper }}</span>
      <span class="clock" id="et-clock">--:--:-- ET</span>
      <button class="btn btn-primary" id="refresh-btn" title="Fetch fresh bars now">⟳ <span class="btn-text">Refresh</span></button>
    </div>
        <div class="searchbox">
        <input id="sym-search" type="text" placeholder="Search symbol… ( / )" autocomplete="off" aria-label="Search symbol" spellcheck="false">
        <div class="sym-drop" id="sym-drop" role="listbox"></div>
      </div>
</header>
  <div class="tape"><div class="tape-track" id="tape-track"></div></div>
  <main class="container-xxl">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-foot">
    Intraday Radar <span class="sep">•</span> Crafted by <span class="credit">M.S.J Hafiz</span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/chart.js?v=19" defer></script>
  <script src="/static/app.js?v=19" defer></script>
</body>
</html>

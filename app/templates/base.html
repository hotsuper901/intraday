<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Intraday Radar{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">▮</span> Intraday <em>Radar</em></a>
    <span class="byline">by <b>M.S.J Hafiz</b></span>
    <div class="topbar-right">
      <span class="pill badge rounded-pill" id="mode-pill">{{ data_mode|upper }}</span>
      <span class="pill badge rounded-pill" id="state-pill">{{ market_state|upper }}</span>
      <span class="clock" id="et-clock">--:--:-- ET</span>
      <button class="btn btn-primary" id="refresh-btn" title="Fetch fresh bars now">⟳ Refresh</button>
    </div>
  </header>
  <div class="tape"><div class="tape-track" id="tape-track"></div></div>
  <main class="container-xxl">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-foot">
    Intraday Radar <span class="sep">•</span> Crafted by <span class="credit">M.S.J Hafiz</span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
